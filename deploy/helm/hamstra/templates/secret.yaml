{{- if and (not .Values.secrets.existingSecret) (or .Values.secrets.tmdbApiKey .Values.secrets.apiKey) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hamstra.fullname" . }}
  labels:
    {{- include "hamstra.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.secrets.tmdbApiKey }}
  {{ .Values.secrets.keys.tmdbApiKey }}: {{ .Values.secrets.tmdbApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.apiKey }}
  {{ .Values.secrets.keys.apiKey }}: {{ .Values.secrets.apiKey | quote }}
  {{- end }}
{{- end }}
